# Enable Apache modules: proxy proxy_http proxy_wstunnel rewrite headers ssl
# Replace the certificate paths only if your certificate manager uses different locations.

<VirtualHost *:80>
    ServerName mothernatureacademy.com
    ServerAlias www.mothernatureacademy.com
    Redirect permanent / https://mothernatureacademy.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName mothernatureacademy.com
    ServerAlias www.mothernatureacademy.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/mothernatureacademy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mothernatureacademy.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 30

    # FastAPI API and health check. Keep this rule before the general Next.js proxy.
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/
    ProxyPass        /health http://127.0.0.1:8000/health
    ProxyPassReverse /health http://127.0.0.1:8000/health

    # Next.js handles all page routes, static assets, and legacy URL redirects.
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/mothernatureacademy-error.log
    CustomLog ${APACHE_LOG_DIR}/mothernatureacademy-access.log combined
</VirtualHost>
